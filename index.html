body{

#roomCode{

color:#ffe45c;margin:6px 0 10px

#menuStatus{min-height:20px;color:#ffb3c8;font-size:14px;margin-top:12px}

#hud{font-size:13px}

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ============================================================
// SETTINGS
// ============================================================

// MAP SIZE (arena is SIZE x SIZE units)
// Use a multiple of 20 (60, 80, 100, 120...) so the walls line up.
const SIZE=100;

const TILE=0.5;               // size of one ink tile
const GRID=Math.round(SIZE/TILE);
const ROUND_TIME=180;         // seconds

const SPAWN_X=SIZE/2-8;       // players start near opposite edges
const LAYOUT=SIZE/2-15;       // walls are laid out from -LAYOUT to +LAYOUT

const WALL_HALF=1.5;          // real half-size of a wall block
const SHOT_WALL_HALF=1.75;    // wall size for flying ink (wall + ink ball radius)

// SHOTS
const SHOT_RANGE=12;          // how far the ink flies (units). The old value was about 22.
const SHOT_SPEED=42;          // units per second
const SHOT_TIME=SHOT_RANGE/SHOT_SPEED;
const SHOT_DROP=(1.6-0.2)/SHOT_TIME;  // ink falls so it lands at the end of its range
const PAINT_RADIUS=1.8;       // size of the splash where ink lands

// HIDING IN INK
const DIVE_SPEED=1.7;         // speed multiplier while hiding in your own ink

// ROLLER
const ROLL_RADIUS=1.7;        // width of the ink strip the roller paints
const ROLL_REACH=1.5;         // how far in front of you the roller paints
const ROLL_HIT=1.6;           // enemies this close to the roller get splatted
const ROLL_SLOW=0.85;         // speed multiplier while rolling

// TEAMS
const TEAM_MAX=4;             // up to 4 players per team (4 vs 4)

// ONLINE
const ROOM_PREFIX='inkbattle3d-';
const NET_SEND_INTERVAL=0.05; // host sends the game state 20 times per second

// ============================================================
// GAME STATE
// ============================================================

let mode='menu';      // 'menu' | 'host' | 'guest'
let playing=false;    // true while a match is running
let ended=false;      // true when the round is over

let players=[];       // everyone in the match (index = roster number)
let roster=defaultRoster(); // everyone in the match: {team, name, weapon}
let myName='Player';  // your username
let myWeapon='shooter'; // 'shooter' (splatter gun) or 'roller'
let myIdx=0;          // which player is you
let me;               // the player the camera follows

let time=ROUND_TIME;
let lastTime=performance.now();
let mapTimer=0;
let netTimer=0;

const r2=v=>Math.round(v*100)/100;
const r3=v=>Math.round(v*1000)/1000;
const wrapAngle=a=>Math.atan2(Math.sin(a),Math.cos(a));

const timerEl=document.getElementById('timer');
const score1El=document.getElementById('score1');
const score2El=document.getElementById('score2');

// ============================================================
// SCENE
// ============================================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(55,1,0.3,300);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.getElementById('game').appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff,0x687080,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-10,25,15);
sun.castShadow=true;
scene.add(sun);

// ARENA

const floor=new THREE.Mesh(
new THREE.BoxGeometry(SIZE,1,SIZE),
new THREE.MeshStandardMaterial({color:0x777b82})
);

floor.position.y=-0.5;
floor.receiveShadow=true;
scene.add(floor);

// OBSTACLES (walls). They are built by buildMap() below, one layout per map.
// Every wall remembers its half size in userData.hx / userData.hz.

const obstacles=[];

// ============================================================
// INK GRID
// ============================================================
//
// The ink is drawn as ONE texture on ONE plane.

const tiles=new Uint8Array(GRID*GRID);   // 0 = empty, 1 = blue, 2 = pink
const tileSize=SIZE/GRID;

let blueCount=0;
let pinkCount=0;

// Tiles inside walls can never be painted (and don't count for the score)

const wallTile=new Uint8Array(GRID*GRID);

let paintableTiles=1;

// ============================================================
// MAPS
// ============================================================
//
// Each map is a list of walls: [centerX, centerZ, width, depth].
// A new random map is picked for every game.
// Keep walls inside about -36 .. +36 so the spawn areas at the
// left and right edges stay open.

// Mirrors walls from one quarter of the arena into all four quarters
function mirror4(list){

const out=[];

for(const [x,z,w,d] of list){
for(const sx of [1,-1]){
for(const sz of [1,-1]){

if(x===0&&sx===-1)continue;
if(z===0&&sz===-1)continue;

out.push([x*sx,z*sz,w,d]);

}}
}

return out;

}

// MAP 1: a grid of small blocks
const blockWalls=[];

for(let x=-LAYOUT;x<=LAYOUT;x+=10){
for(let z=-LAYOUT;z<=LAYOUT;z+=10){
blockWalls.push([x,z,3,3]);
}}

const MAPS=[

{
name:'BLOCKS',
floor:0x777b82,wall:0x555b64,sky:0x87ceeb,
boxes:blockWalls
},

{
// long walls with gaps, like lanes
name:'CORRIDORS',
floor:0x7a746c,wall:0x59514a,sky:0xf0c987,
boxes:mirror4([
[20,8,20,3],
[8,24,16,3]
])
},

{
// a walled plaza in the middle with a gate on every side
name:'PLAZA',
floor:0x6d7c7a,wall:0x46585a,sky:0x9fd8d0,
boxes:mirror4([
[8,10,8,3],
[10,6.5,3,7],
[26,26,8,8],
[24,0,3,3]
])
},

{
// staggered walls to zig-zag through
name:'ZIGZAG',
floor:0x7b7690,wall:0x4f4a68,sky:0xb7a6e8,
boxes:mirror4([
[0,16,3,14],
[14,0,3,18],
[14,30,3,8],
[28,18,3,12],
[7,8,8,3]
])
},

{
// a big wall in the middle and bunkers around it
name:'BUNKERS',
floor:0x84806a,wall:0x5e5a46,sky:0xe8e3a0,
boxes:mirror4([
[0,0,6,30],
[22,15,10,3],
[18,26,3,10],
[10,8,3,3]
])
}

];

let currentMap=0;
let lastPickedMap=-1;

// Random map, never the same one twice in a row
function pickMap(){

let id;

do{
id=Math.floor(Math.random()*MAPS.length);
}while(id===lastPickedMap&&MAPS.length>1);

lastPickedMap=id;

return id;

}

// Builds the walls, colors and wall tiles of a map
function buildMap(id){

const map=MAPS[id]||MAPS[0];

currentMap=MAPS[id]?id:0;

for(const b of obstacles){
scene.remove(b);
b.geometry.dispose();
b.material.dispose();
}

obstacles.length=0;

floor.material.color.set(map.floor);
scene.background=new THREE.Color(map.sky);

for(const [x,z,w,d] of map.boxes){

const block=new THREE.Mesh(
new THREE.BoxGeometry(w,2.5,d),
new THREE.MeshStandardMaterial({color:map.wall})
);

block.position.set(x,1.25,z);
block.userData={hx:w/2,hz:d/2};
block.castShadow=true;
block.receiveShadow=true;

scene.add(block);
obstacles.push(block);

}

// Tiles inside walls can never be painted (and don't count for the score)

wallTile.fill(0);

for(const b of obstacles){

const hx=b.userData.hx;
const hz=b.userData.hz;

const minTx=Math.max(0,Math.floor((b.position.x-hx+SIZE/2)/tileSize));
const maxTx=Math.min(GRID-1,Math.ceil((b.position.x+hx+SIZE/2)/tileSize));

const minTz=Math.max(0,Math.floor((b.position.z-hz+SIZE/2)/tileSize));
const maxTz=Math.min(GRID-1,Math.ceil((b.position.z+hz+SIZE/2)/tileSize));

for(let tz=minTz;tz<=maxTz;tz++){
for(let tx=minTx;tx<=maxTx;tx++){

const wx=-SIZE/2+(tx+0.5)*tileSize;
const wz=-SIZE/2+(tz+0.5)*tileSize;

if(
Math.abs(wx-b.position.x)<hx&&
Math.abs(wz-b.position.z)<hz
){
wallTile[tz*GRID+tx]=1;
}

}}

}

paintableTiles=0;

for(const w of wallTile){
if(!w)paintableTiles++;
}

}

buildMap(0);

const inkColors=[
0x777b82,
0x168cff,
0xff3c9e
];

const inkRGB=inkColors.map(c=>[
(c>>16)&255,
(c>>8)&255,
c&255
]);

// inkData = used by the 3D texture (rows are flipped to match the plane)
// mapData = used by the minimap (normal orientation)

const inkData=new Uint8Array(GRID*GRID*4);
const mapData=new Uint8ClampedArray(GRID*GRID*4);

const inkTexture=new THREE.DataTexture(
inkData,GRID,GRID,THREE.RGBAFormat
);

inkTexture.magFilter=THREE.NearestFilter;
inkTexture.minFilter=THREE.LinearFilter;
inkTexture.colorSpace=THREE.SRGBColorSpace;
inkTexture.generateMipmaps=false;
inkTexture.needsUpdate=true;

const inkPlane=new THREE.Mesh(
new THREE.PlaneGeometry(SIZE,SIZE),
new THREE.MeshBasicMaterial({
map:inkTexture,
transparent:true,
depthWrite:false,
polygonOffset:true,
polygonOffsetFactor:-1,
polygonOffsetUnits:-1
})
);

inkPlane.rotation.x=-Math.PI/2;
inkPlane.position.y=0.012;
scene.add(inkPlane);

let inkDirty=false;

function setTile(index,team){

const tx=index%GRID;
const tz=(index-tx)/GRID;

const rgb=inkRGB[team];
const alpha=team===0?0:255;

// 3D texture (row 0 of the texture is the +Z side of the plane)
const o=((GRID-1-tz)*GRID+tx)*4;

inkData[o]=rgb[0];
inkData[o+1]=rgb[1];
inkData[o+2]=rgb[2];
inkData[o+3]=alpha;

// minimap
const m=index*4;

mapData[m]=rgb[0];
mapData[m+1]=rgb[1];
mapData[m+2]=rgb[2];
mapData[m+3]=alpha;

inkDirty=true;

}

function clearInk(){

tiles.fill(0);
inkData.fill(0);
mapData.fill(0);

blueCount=0;
pinkCount=0;
inkDirty=true;

}

// Which team's ink is at this spot? (0 = nobody's)
function tileAt(x,z){

const tx=Math.floor((x+SIZE/2)/tileSize);
const tz=Math.floor((z+SIZE/2)/tileSize);

if(tx<0||tx>=GRID||tz<0||tz>=GRID)return 0;

return tiles[tz*GRID+tx];

}

// ============================================================
// PLAYERS
// ============================================================
//
// DIRECTION CONVENTION
// direction = 0        -> facing -Z (up on the minimap)
// direction = PI/2     -> facing +X (right on the minimap)
// Forward vector = ( sin(direction), -cos(direction) )
// The 3D model is rotated by -direction so it faces the same way.

// Teams start on opposite edges. Teammates line up side by side.
function spawnPoint(team,slot){

return{
x:team===1?-SPAWN_X:SPAWN_X,
z:(slot-1.5)*6,
d:team===1?Math.PI/2:-Math.PI/2
};

}

// Name tag that floats above a player
function makeNameTag(name,team){

const canvas=document.createElement('canvas');
canvas.width=256;
canvas.height=64;

const g=canvas.getContext('2d');

g.font='bold 34px Arial';
g.textAlign='center';
g.textBaseline='middle';
g.lineWidth=7;
g.strokeStyle='rgba(0,0,0,0.85)';
g.strokeText(name,128,32);
g.fillStyle=team===1?'#7cc4ff':'#ff9ccf';
g.fillText(name,128,32);

const texture=new THREE.CanvasTexture(canvas);
texture.colorSpace=THREE.SRGBColorSpace;

const sprite=new THREE.Sprite(
new THREE.SpriteMaterial({map:texture,transparent:true})
);

sprite.scale.set(3.2,0.8,1);
sprite.position.y=2.9;

return sprite;

}

function createPlayer(team,slot,idx,name,kind){

const color=team===1?0x168cff:0xff3c9e;
const spawn=spawnPoint(team,slot);

const x=spawn.x;
const z=spawn.z;
const direction=spawn.d;

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.65,1.1,4,8),
new THREE.MeshStandardMaterial({color})
);

body.position.y=1.2;
body.castShadow=true;
group.add(body);

let weapon;
let drum=null;

if(kind==='roller'){

// ROLLER: a handle with a big ink drum in front of you
weapon=new THREE.Group();
weapon.position.set(0,0.95,0);

const handle=new THREE.Mesh(
new THREE.CylinderGeometry(0.06,0.06,1.3),
new THREE.MeshStandardMaterial({color:0x252525})
);

handle.rotation.x=Math.PI/2;
handle.position.set(0,0.2,-0.65);
weapon.add(handle);

drum=new THREE.Mesh(
new THREE.CylinderGeometry(0.55,0.55,1.9,16),
new THREE.MeshStandardMaterial({color,roughness:0.5})
);

drum.rotation.z=Math.PI/2;
drum.position.set(0,-0.35,-1.35);
drum.castShadow=true;
weapon.add(drum);

}else{

// SPLATTER GUN
weapon=new THREE.Mesh(
new THREE.CylinderGeometry(0.13,0.18,1.5),
new THREE.MeshStandardMaterial({color:0x252525})
);

weapon.rotation.x=Math.PI/2;
weapon.position.set(0,1.4,-0.8);

}

group.add(weapon);

// HIDING: a flat blob of ink. You and your teammates can see it.
const blob=new THREE.Mesh(
new THREE.SphereGeometry(0.7,16,10),
new THREE.MeshStandardMaterial({
color,roughness:0.3,emissive:color,emissiveIntensity:0.25
})
);

blob.scale.set(1,0.3,1.3);
blob.position.y=0.2;
blob.visible=false;
group.add(blob);

// HIDING: a faint ripple the ENEMIES can see while you swim (a small clue)
const ring=new THREE.Mesh(
new THREE.RingGeometry(0.55,0.8,24),
new THREE.MeshBasicMaterial({
color:0xffffff,transparent:true,opacity:0.35,
side:THREE.DoubleSide,depthWrite:false
})
);

ring.rotation.x=-Math.PI/2;
ring.position.y=0.05;
ring.visible=false;
group.add(ring);

// A little yellow arrow above YOUR player, so you can find yourself
const marker=new THREE.Mesh(
new THREE.ConeGeometry(0.3,0.6,4),
new THREE.MeshBasicMaterial({color:0xffe45c})
);

marker.rotation.x=Math.PI;
marker.position.y=3.3;
marker.visible=false;
group.add(marker);

const tag=makeNameTag(name,team);
group.add(tag);

group.position.set(x,0,z);
group.rotation.y=-direction;
scene.add(group);

return{
group,body,weapon,drum,blob,ring,marker,tag,
idx,team,slot,name,kind,
rolling:false,
rollTimer:0,
x,z,
direction,
color,
shots:[],
cooldown:0,
dead:false,
gone:false,     // true when the player left the match (host only)
respawn:0,
kills:0,
diving:false,   // true while hiding in own ink
moving:false,
member:null,    // host only: the online connection that controls this player
target:{x,z,d:direction}   // used to smooth other players online
};

}

// Shows the right model for the current hiding state.
// Normal: body + weapon. Hiding: you and your teammates see an ink blob,
// enemies see nothing (only a faint ripple while you move).
function updateVisual(p){

if(!p||!me)return;

const mate=p.team===me.team;

p.body.visible=!p.diving;
p.weapon.visible=!p.diving;
p.blob.visible=p.diving&&mate;
p.ring.visible=p.diving&&!mate&&p.moving;
p.marker.visible=(p===me)&&!p.diving;

// Name tags: not on yourself, not on enemies hiding in ink
p.tag.visible=(p!==me)&&(!p.diving||mate);
p.tag.position.y=p.diving?1.1:2.9;

// The roller drum spins while rolling
if(p.rolling&&p.drum)p.drum.rotation.x-=0.35;

}

function resetPlayers(){

players=[];

const used={1:0,2:0};

roster.forEach((r,i)=>{
players.push(createPlayer(r.team,used[r.team]++,i,r.name,r.weapon));
});

// The camera follows you
me=players[myIdx]||players[0];

players.forEach(updateVisual);

}

// ============================================================
// CAMERA
// ============================================================

function updateCamera(dt,snap=false){

// The camera comes in closer and lower while you hide in ink
const distance=me.diving?7.5:9;
const height=me.diving?4:6;

// Camera stays behind your player

const behindX=-Math.sin(me.direction);
const behindZ=Math.cos(me.direction);

const target=new THREE.Vector3(
me.x+behindX*distance,
height,
me.z+behindZ*distance
);

if(snap){

camera.position.copy(target);

}else{

const smoothness=1-Math.exp(-5*dt);
camera.position.lerp(target,smoothness);

}

camera.lookAt(
me.x,
1.2,
me.z
);

}

// ============================================================
// KEYBOARD
// ============================================================

const keys={};

const GAME_KEYS=new Set([
'w','a','s','d','f','e','enter','shift','/','.',
'arrowup','arrowdown','arrowleft','arrowright',' '
]);

window.addEventListener('keydown',e=>{

// Let people type the room code
if(e.target&&e.target.tagName==='INPUT')return;

const key=e.key.toLowerCase();

keys[key]=true;

if(GAME_KEYS.has(key)){

// Stops Enter from clicking a focused button
e.preventDefault();

if(document.activeElement){
document.activeElement.blur();
}

}

});

window.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

// Clear stuck keys when the window loses focus
window.addEventListener('blur',()=>{
for(const k in keys)keys[k]=false;
});

// INPUTS
// Every player is controlled through a simple input object:
// { up, down, left, right, shoot, dive }

// Online: WASD or arrows, F or Enter or Space to shoot, E or Shift or / to hide
function inputOnline(){
return{
up:!!(keys['w']||keys['arrowup']),
down:!!(keys['s']||keys['arrowdown']),
left:!!(keys['a']||keys['arrowleft']),
right:!!(keys['d']||keys['arrowright']),
shoot:!!(keys['f']||keys['enter']||keys[' ']),
dive:!!(keys['e']||keys['shift']||keys['/'])
};
}

// Input of the remote player (host side)
const EMPTY_INPUT={up:false,down:false,left:false,right:false,shoot:false,dive:false};

// ============================================================
// LINE vs WALL TEST
// ============================================================
// Returns true if the line from (x1,z1) to (x2,z2)
// touches the square wall centered at (cx,cz).

function segmentHitsBox(x1,z1,x2,z2,cx,cz,hx,hz){

const minX=cx-hx;
const maxX=cx+hx;
const minZ=cz-hz;
const maxZ=cz+hz;

const dx=x2-x1;
const dz=z2-z1;

let tMin=0;
let tMax=1;

if(Math.abs(dx)<0.000001){

if(x1<minX||x1>maxX)return false;

}else{

let t1=(minX-x1)/dx;
let t2=(maxX-x1)/dx;

if(t1>t2){
const tmp=t1;
t1=t2;
t2=tmp;
}

tMin=Math.max(tMin,t1);
tMax=Math.min(tMax,t2);

}

if(Math.abs(dz)<0.000001){

if(z1<minZ||z1>maxZ)return false;

}else{

let t1=(minZ-z1)/dz;
let t2=(maxZ-z1)/dz;

if(t1>t2){
const tmp=t1;
t1=t2;
t2=tmp;
}

tMin=Math.max(tMin,t1);
tMax=Math.min(tMax,t2);

}

return tMax>=tMin&&tMin<=1&&tMax>=0;

}

// Distance from a point to a line segment
function distToSegment(px,pz,x1,z1,x2,z2){

const dx=x2-x1;
const dz=z2-z1;
const len2=dx*dx+dz*dz;

let t=len2>0?((px-x1)*dx+(pz-z1)*dz)/len2:0;
t=Math.max(0,Math.min(1,t));

return Math.hypot(px-(x1+t*dx),pz-(z1+t*dz));

}

// ============================================================
// PAINT
// ============================================================
//
// Ink can not:
//  - cover tiles inside a wall
//  - spread to the other side of a wall

function paint(x,z,team,radius=1.6){

// Only walls close to the splash can block it
const nearWalls=obstacles.filter(b=>
Math.abs(b.position.x-x)<radius+b.userData.hx+1&&
Math.abs(b.position.z-z)<radius+b.userData.hz+1
);

const minX=Math.floor((x-radius+SIZE/2)/tileSize);
const maxX=Math.floor((x+radius+SIZE/2)/tileSize);

const minZ=Math.floor((z-radius+SIZE/2)/tileSize);
const maxZ=Math.floor((z+radius+SIZE/2)/tileSize);

for(let tz=minZ;tz<=maxZ;tz++){
for(let tx=minX;tx<=maxX;tx++){

if(tx<0||tx>=GRID||tz<0||tz>=GRID)continue;

const index=tz*GRID+tx;

// Never paint inside a wall
if(wallTile[index])continue;

// Already this color
if(tiles[index]===team)continue;

const wx=-SIZE/2+(tx+0.5)*tileSize;
const wz=-SIZE/2+(tz+0.5)*tileSize;

if(Math.hypot(wx-x,wz-z)>radius)continue;

// Never paint tiles that are behind a wall
let behindWall=false;

for(const b of nearWalls){

if(segmentHitsBox(
x,z,wx,wz,
b.position.x,b.position.z,
b.userData.hx,b.userData.hz
)){
behindWall=true;
break;
}

}

if(behindWall)continue;

// Update team counts
const old=tiles[index];

if(old===1)blueCount--;
if(old===2)pinkCount--;

if(team===1)blueCount++;
if(team===2)pinkCount++;

tiles[index]=team;
setTile(index,team);

}}
}

// ============================================================
// COLLISION
// ============================================================

function blocked(x,z){

if(
Math.abs(x)>SIZE/2-1||
Math.abs(z)>SIZE/2-1
)return true;

return obstacles.some(b=>
Math.abs(x-b.position.x)<b.userData.hx+0.6&&
Math.abs(z-b.position.z)<b.userData.hz+0.6
);

}

// PROJECTILE WALL COLLISION

function segmentHitsWall(x1,z1,x2,z2){

for(const b of obstacles){

if(segmentHitsBox(
x1,z1,x2,z2,
b.position.x,b.position.z,
b.userData.hx+0.25,b.userData.hz+0.25
)){
return true;
}

}

return false;

}

// ============================================================
// SHOOTING
// ============================================================

// Shared by all ink balls (no new geometry per shot)
const ballGeometry=new THREE.SphereGeometry(0.25,12,10);

const ballMaterials=[
null,
new THREE.MeshStandardMaterial({color:inkColors[1],roughness:0.4}),
new THREE.MeshStandardMaterial({color:inkColors[2],roughness:0.4})
];

// Creates the 4 ink balls
// (the online guest also calls this to show the host's shots)
function fireShots(owner,x,z,direction){

const team=owner.team;

for(let i=0;i<4;i++){

const spread=(i-1.5)*0.09;
const angle=direction+spread;

const ball=new THREE.Mesh(ballGeometry,ballMaterials[team]);

ball.position.set(
x+Math.sin(angle)*0.9,
1.6,
z-Math.cos(angle)*0.9
);

scene.add(ball);

owner.shots.push({
mesh:ball,
vx:Math.sin(angle)*SHOT_SPEED,
vz:-Math.cos(angle)*SHOT_SPEED,
life:SHOT_TIME+0.1,
team
});

}

}

function shoot(player){

if(player.dead||player.cooldown>0)return;

player.cooldown=0.5;

fireShots(player,player.x,player.z,player.direction);

// Tell the online guests to show these shots too
if(mode==='host'){
send({t:'s',i:player.idx,x:r2(player.x),z:r2(player.z),d:r3(player.direction)});
}

}

// ============================================================
// PLAYER UPDATE
// ============================================================
//
// Both players use tank-style controls:
//   up/down    = move forward/backward
//   left/right = turn left/right
//   dive       = hold to hide in your OWN team's ink
//
// While hiding you are invisible to the enemy, move faster,
// and can not shoot. You come back up if you leave your ink.
//
// authority = true  -> this machine decides everything (local game or host)
// authority = false -> online guest: only predicts its own movement

function killPlayer(victim,killer){

victim.dead=true;
victim.diving=false;
victim.moving=false;
victim.rolling=false;
victim.respawn=120;
victim.group.visible=false;

killer.kills++;

}

// ROLLER: paints a wide strip in front of you and splats enemies it touches.
// (Only the host / authority runs this.)
function roll(player,dt){

player.rollTimer-=dt;

const rx=player.x+Math.sin(player.direction)*ROLL_REACH;
const rz=player.z-Math.cos(player.direction)*ROLL_REACH;

for(const enemy of players){

if(enemy.team===player.team||enemy.dead)continue;

if(Math.hypot(enemy.x-rx,enemy.z-rz)<ROLL_HIT){
killPlayer(enemy,player);
}

}

if(player.rollTimer>0)return;

player.rollTimer=0.06;

paint(rx,rz,player.team,ROLL_RADIUS);

if(mode==='host'){
send({t:'p',x:r2(rx),z:r2(rz),team:player.team,r:ROLL_RADIUS});
}

}

function updatePlayer(player,input,dt,authority){

const team=player.team;

if(player.dead){

player.diving=false;
player.moving=false;
player.rolling=false;

if(authority&&!player.gone){

player.respawn-=dt*60; // about 2 seconds, independent of frame rate

if(player.respawn<=0){

const sp=spawnPoint(team,player.slot);

player.dead=false;
player.x=sp.x;
player.z=sp.z;
player.direction=sp.d;

player.group.visible=true;
player.group.rotation.y=-player.direction;
player.group.position.set(
player.x,0,player.z
);

}

}

return;
}

// HIDING: only possible while standing in your own team's ink
const diving=!!input.dive&&tileAt(player.x,player.z)===team;

player.diving=diving;

// ROLLER: holding the shoot key rolls ink in front of you
const rolling=player.kind==='roller'&&!!input.shoot&&!diving;

player.rolling=rolling;

const turnSpeed=2.8*dt; // radians per second
const speed=7.8*dt*(diving?DIVE_SPEED:1)*(rolling?ROLL_SLOW:1); // units per second

if(input.left){
player.direction-=turnSpeed;
}

if(input.right){
player.direction+=turnSpeed;
}

let forward=0;

if(input.up)forward+=1;
if(input.down)forward-=1;

player.moving=forward!==0;

if(forward!==0){

const dx=Math.sin(player.direction)*speed*forward;
const dz=-Math.cos(player.direction)*speed*forward;

const oldX=player.x;
const oldZ=player.z;

player.x+=dx;

if(blocked(player.x,player.z)){
player.x=oldX;
}

player.z+=dz;

if(blocked(player.x,player.z)){
player.z=oldZ;
}

}

// Negative sign so the model faces the same way you move and shoot

player.group.rotation.y=-player.direction;

player.group.position.set(
player.x,0,player.z
);

updateVisual(player);

// SHOOT (only the host creates shots)
// You can not shoot while hiding in ink.

if(authority&&input.shoot&&!diving){

if(player.kind==='roller')roll(player,dt);
else shoot(player);

}

player.cooldown=Math.max(
0,
player.cooldown-dt
);

}

// ============================================================
// PROJECTILE UPDATE
// ============================================================
// authority = false (online guest): the balls are only visuals.
// Painting and hits come from the host.
// Ink only hurts players of the OTHER team.

function updateShots(owner,authority,dt){

for(let i=owner.shots.length-1;i>=0;i--){

const s=owner.shots[i];

const oldX=s.mesh.position.x;
const oldZ=s.mesh.position.z;

const newX=oldX+s.vx*dt;
const newZ=oldZ+s.vz*dt;

const newY=Math.max(
0.2,
s.mesh.position.y-SHOT_DROP*dt
);

// WALL COLLISION

if(
newY<=2.75&&
segmentHitsWall(oldX,oldZ,newX,newZ)
){

removeShot(owner,i);
continue;

}

// UPDATE POSITION

s.mesh.position.x=newX;
s.mesh.position.z=newZ;
s.mesh.position.y=newY;

s.life-=dt;

// ENEMY COLLISION

let hit=null;

if(newY<2.2){

for(const enemy of players){

if(enemy.team===owner.team||enemy.dead)continue;

if(distToSegment(enemy.x,enemy.z,oldX,oldZ,newX,newZ)<0.9){
hit=enemy;
break;
}

}

}

if(hit){

if(authority){

hit.dead=true;
hit.diving=false;
hit.moving=false;
hit.respawn=120;
hit.group.visible=false;

owner.kills++;

}

removeShot(owner,i);
continue;

}

// GROUND AND BOUNDARIES

if(
newY<=0.25||
s.life<=0||
Math.abs(newX)>SIZE/2||
Math.abs(newZ)>SIZE/2
){

if(
authority&&
Math.abs(newX)<SIZE/2&&
Math.abs(newZ)<SIZE/2&&
newY<=0.25
){

paint(newX,newZ,s.team,PAINT_RADIUS);

// Tell the online guests where ink landed
if(mode==='host'){
send({t:'p',x:r2(newX),z:r2(newZ),team:s.team});
}

}

removeShot(owner,i);

}

}

}

function removeShot(player,index){

scene.remove(player.shots[index].mesh);
player.shots.splice(index,1);

}

// ============================================================
// SCORING
// ============================================================
// Percentages are based on tiles that can actually be painted

function calculateScore(){

score1El.textContent=
`BLUE: ${Math.round(blueCount/paintableTiles*100)}%`;

score2El.textContent=
`PINK: ${Math.round(pinkCount/paintableTiles*100)}%`;

return{blue:blueCount,pink:pinkCount};

}

function formatTime(t){

const seconds=Math.ceil(t);

return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;

}

// ============================================================
// MINIMAP
// ============================================================

const mapCanvas=document.getElementById('map');
const ctx=mapCanvas.getContext('2d');

// Small canvas (1 pixel per ink tile) that gets scaled onto the minimap
const inkCanvas=document.createElement('canvas');
inkCanvas.width=GRID;
inkCanvas.height=GRID;

const inkCtx=inkCanvas.getContext('2d');
const mapImage=new ImageData(mapData,GRID,GRID);

function drawMap(){

const mapW=mapCanvas.width;
const mapH=mapCanvas.height;

ctx.fillStyle='#333b48';
ctx.fillRect(0,0,mapW,mapH);

// TERRITORY

inkCtx.putImageData(mapImage,0,0);

ctx.imageSmoothingEnabled=false;
ctx.drawImage(inkCanvas,0,0,mapW,mapH);

// WALLS

ctx.fillStyle='#1a1e27';

for(const b of obstacles){

ctx.fillRect(
(b.position.x-b.userData.hx+SIZE/2)/SIZE*mapW,
(b.position.z-b.userData.hz+SIZE/2)/SIZE*mapH,
(b.userData.hx*2)/SIZE*mapW,
(b.userData.hz*2)/SIZE*mapH
);

}

// PLAYER DOTS
// Teammates are always shown. An enemy hiding in ink is not.
// Your own dot has a yellow ring.

for(const p of players){

if(p.gone)continue;
if(p.dead&&p!==me)continue;
if(p.diving&&p.team!==me.team)continue;

ctx.fillStyle=p.team===1?'#168cff':'#ff3c9e';
ctx.strokeStyle=p===me?'#ffe45c':'white';
ctx.lineWidth=p===me?3:1.5;

ctx.beginPath();

ctx.arc(
(p.x+SIZE/2)/SIZE*mapW,
(p.z+SIZE/2)/SIZE*mapH,
p===me?6:4.5,0,Math.PI*2
);

ctx.fill();
ctx.stroke();

}

}

// ROUND
// ============================================================

function showResult(blue,pink){

let winner='DRAW!';

if(blue>pink)winner='BLUE WINS!';
if(pink>blue)winner='PINK WINS!';

document.getElementById('winner').textContent=winner;

document.getElementById('finalScore').textContent=
`Blue: ${Math.round(blue/paintableTiles*100)}% | Pink: ${Math.round(pink/paintableTiles*100)}%`;

// Only the host (or a local game) can start a new round
const guest=mode==='guest';

document.getElementById('playAgain').style.display=guest?'none':'inline-block';
document.getElementById('resultNote').textContent=
guest?'Waiting for the host to start a rematch...':'';

document.getElementById('result').style.display='flex';

}

function finish(){

ended=true;

const score=calculateScore();

showResult(score.blue,score.pink);

if(mode==='host'){
send({t:'end',blue:score.blue,pink:score.pink});
}

}

// Resets the whole world for a new round
function resetMatch(){

for(const p of players){

for(const s of p.shots){
scene.remove(s.mesh);
}

scene.remove(p.group);

}

buildMap(currentMap);
clearInk();

for(const key in keys){
keys[key]=false;
}

lastInputKey='';
inputTimer=0;
netTimer=0;

resetPlayers();

time=ROUND_TIME;
ended=false;
mapTimer=0;

// Shows the name of the map for a few seconds at the start of a match

el.textContent='MAP: '+MAPS[currentMap].name;

// Starts a round (host or guest)

}

// ============================================================
// ONLINE (PeerJS, host-authoritative)
// ============================================================
//
// - The HOST creates a room (a short room code). Up to 7 more players can
//   join: 4 per team at most (4 vs 4). New players join the smaller team.
// - The host presses START MATCH when everybody is in the lobby.
// - GUESTS send only their key presses.
// - The host simulates everything and sends the state to the guests.

let net={peer:null,hostConn:null,members:[],code:''};

let lastInputKey='';
let inputTimer=0;

// Sends a message to everybody (host) or to the host (guest)
function send(msg){

if(mode==='host'){

for(const m of net.members){
if(m.conn.open)m.conn.send(msg);
}

}else if(net.hostConn&&net.hostConn.open){

net.hostConn.send(msg);

}

}

function closeNet(){

for(const m of [...net.members]){
try{m.conn.close();}catch(e){}
}

try{if(net.hostConn)net.hostConn.close();}catch(e){}
try{if(net.peer)net.peer.destroy();}catch(e){}

net={peer:null,hostConn:null,members:[],code:''};

}

window.addEventListener('beforeunload',closeNet);

const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function makeCode(){

let code='';

for(let i=0;i<5;i++){
code+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
}

return code;

}

// ---------- HOST ----------

// The host is always on team 1 (blue)
function teamCount(team){

return (team===1?1:0)+net.members.filter(m=>m.team===team).length;

}

function hostGame(){

if(typeof Peer==='undefined'){
setStatus('Online play needs the PeerJS library. Check your internet connection and reload the page.');
return;
}

readPrefs();

closeNet();

mode='host';
playing=false;

setStatus('Creating room...');

openHostPeer(0);

}

function openHostPeer(tries){

const code=makeCode();
const peer=new Peer(ROOM_PREFIX+code);

net.peer=peer;
net.code=code;

peer.on('open',()=>{
showLobby(code,'Waiting for players. Press START MATCH when everyone is in.');
broadcastLobby();
});

peer.on('connection',onGuestConnection);

peer.on('error',err=>{

// Room code already used by someone else: try another one
if(err.type==='unavailable-id'&&tries<5){
try{peer.destroy();}catch(e){}
openHostPeer(tries+1);
return;
}

failToMenu('Could not create the room ('+err.type+').');

});

peer.on('disconnected',()=>{
// Lost the connection to the matchmaking server: try to get it back
try{peer.reconnect();}catch(e){}
});

}

// Matchmaking on the host: new players join the smaller team
function onGuestConnection(conn){

const blue=teamCount(1);
const pink=teamCount(2);

// Room is full (4 vs 4) or the match already started
if(playing||blue+pink>=TEAM_MAX*2){

conn.on('open',()=>{
conn.send({t:'full'});
setTimeout(()=>{try{conn.close();}catch(e){}},500);
});

return;

}

let team=blue<=pink?1:2;

if(team===1&&blue>=TEAM_MAX)team=2;
if(team===2&&pink>=TEAM_MAX)team=1;

const member={conn,team,idx:-1,input:{...EMPTY_INPUT},name:'Player',weapon:'shooter'};

net.members.push(member);

conn.on('open',()=>broadcastLobby());
conn.on('data',m=>handleHostData(member,m));

conn.on('close',()=>memberLeft(member));
conn.on('error',()=>memberLeft(member));

}

// Tells everybody who is on which team
function lobbyList(){

return[
{n:myName,t:1,w:myWeapon},
...net.members.map(m=>({n:m.name,t:m.team,w:m.weapon}))
];

}

function broadcastLobby(){

const list=lobbyList();

updateLobbyTeams(list,1);

for(const m of net.members){
if(m.conn.open)m.conn.send({t:'lobby',list,team:m.team});
}

}

function backToLobby(text){

playing=false;
ended=false;

document.getElementById('result').style.display='none';

showLobby(net.code,text);
broadcastLobby();

}

function memberLeft(member){

const i=net.members.indexOf(member);

if(mode!=='host'||i<0)return;

net.members.splice(i,1);

if(playing){

// Remove the player from the running match
const p=players[member.idx];

if(p){
p.gone=true;
p.dead=true;
p.diving=false;
p.moving=false;
p.group.visible=false;
}

if(net.members.length===0){
backToLobby('Everyone left. Waiting for players...');
}

}else{

broadcastLobby();

}

}

function hostStart(){

if(mode!=='host')return;

startHostedMatch();

}

// Starts (or restarts) a match with everybody who is connected
function startHostedMatch(){

net.members=net.members.filter(m=>m.conn.open);

if(net.members.length===0){
backToLobby('Waiting for players...');
setStatus('You need at least one other player.');
return;
}

if(teamCount(1)===0||teamCount(2)===0){
backToLobby('Waiting for players...');
setStatus('Both teams need at least one player.');
return;
}

net.members.forEach((m,i)=>{
m.idx=i+1;
m.input={...EMPTY_INPUT};
});

// Roster: the host first (blue), then every guest
roster=[
{team:1,name:myName,weapon:myWeapon},
...net.members.map(m=>({team:m.team,name:m.name,weapon:m.weapon}))
];
myIdx=0;

currentMap=pickMap();

startMatch();

net.members.forEach(m=>{
players[m.idx].member=m;
m.conn.send({t:'start',roster,you:m.idx,map:currentMap});
});

}

function handleHostData(member,m){

if(!m||typeof m!=='object')return;

if(m.t==='hello'){

member.name=cleanName(m.name,'Player');
member.weapon=m.weapon==='roller'?'roller':'shooter';

broadcastLobby();

return;

}

if(m.t==='i'){

member.input={
up:!!m.up,
down:!!m.down,
left:!!m.left,
right:!!m.right,
shoot:!!m.shoot,
dive:!!m.dive
};

}

}

function snapshot(){

return{
t:'st',
time:r2(time),
p:players.map(p=>[r2(p.x),r2(p.z),r3(p.direction),p.dead?1:0,p.diving?1:0,p.rolling?1:0])
};

}

// ---------- GUEST ----------

function joinGame(){

const code=document.getElementById('roomInput').value.trim().toUpperCase();

if(code.length<3){
setStatus('Type the room code first.');
return;
}

if(typeof Peer==='undefined'){
setStatus('Online play needs the PeerJS library. Check your internet connection and reload the page.');
return;
}

readPrefs();

closeNet();

mode='guest';
playing=false;
net.code=code;

setStatus('Connecting to room '+code+'...');

const peer=new Peer();
net.peer=peer;

let opened=false;

const timeout=setTimeout(()=>{
if(!opened)failToMenu('Could not connect. Check the room code and try again.');
},12000);

peer.on('open',()=>{

const conn=peer.connect(ROOM_PREFIX+code,{
reliable:true,
serialization:'json'
});

net.hostConn=conn;

conn.on('open',()=>{
opened=true;
clearTimeout(timeout);
setStatus('Connected! Waiting for the host...');
conn.send({t:'hello',name:myName,weapon:myWeapon});
});

conn.on('data',handleGuestData);

conn.on('close',()=>{
clearTimeout(timeout);
if(mode==='guest')failToMenu('The host left the game.');
});

conn.on('error',()=>{
clearTimeout(timeout);
if(mode==='guest')failToMenu('Connection lost.');
});

});

peer.on('error',err=>{

clearTimeout(timeout);

if(mode!=='guest')return;

if(err.type==='peer-unavailable'){
failToMenu('Room not found. Check the code.');
}else{
failToMenu('Connection error ('+err.type+').');
}

});

}

function handleGuestData(m){

if(!m||typeof m!=='object')return;

switch(m.t){

case 'full':
failToMenu('That room is full or the match already started.');
break;

case 'lobby':
showLobby(net.code,'Waiting for the host to start the match...');
if(Array.isArray(m.list)){
updateLobbyTeams(m.list.slice(0,TEAM_MAX*2).map(x=>({
n:cleanName(x&&x.n,'Player'),
t:x&&x.t===2?2:1,
w:x&&x.w==='roller'?'roller':'shooter'
})),m.team===2?2:1);
}
break;

case 'start':
if(Array.isArray(m.roster)&&m.roster.length>=2&&m.roster.length<=TEAM_MAX*2){
roster=m.roster.map(r=>({
team:r&&r.team===2?2:1,
name:cleanName(r&&r.name,'Player'),
weapon:r&&r.weapon==='roller'?'roller':'shooter'
}));
myIdx=m.you|0;
currentMap=m.map|0;
startMatch();
}
break;

case 'st':
if(playing&&!ended)applyState(m);
break;

case 's':
if(playing&&!ended&&players[m.i]&&isFinite(m.x)&&isFinite(m.z)&&isFinite(m.d)){
fireShots(players[m.i],m.x,m.z,m.d);
}
break;

case 'p':
if(playing&&!ended&&(m.team===1||m.team===2)&&isFinite(m.x)&&isFinite(m.z)){
paint(m.x,m.z,m.team,(isFinite(m.r)&&m.r>0&&m.r<=4)?m.r:PAINT_RADIUS);
}
break;

case 'end':
if(playing&&!ended){
ended=true;
blueCount=m.blue|0;
pinkCount=m.pink|0;
calculateScore();
showResult(blueCount,pinkCount);
}
break;

}

}

// Guest: apply the state sent by the host

function setDeadFlag(p,dead){

const was=p.dead;

p.dead=dead;
p.group.visible=!dead;

return was&&!dead; // true if the player just respawned

}

function applyState(m){

if(!Array.isArray(m.p))return;

time=m.time;

players.forEach((p,i)=>{

const s=m.p[i];

if(!s)return;

if(p===me)syncOwn(p,s);
else syncRemote(p,s);

});

}

// The other players: just remember where the host says they are
function syncRemote(p,s){

const respawned=setDeadFlag(p,!!s[3]);

// Hiding state comes from the host
p.diving=!p.dead&&!!s[4];
p.rolling=!p.dead&&!!s[5];

p.target.x=s[0];
p.target.z=s[1];
p.target.d=s[2];

if(respawned){
p.x=s[0];
p.z=s[1];
p.direction=s[2];
}

}

// Your own player: moves instantly (prediction), then gets gently
// pulled towards the position the host says is correct
function syncOwn(p,s){

const respawned=setDeadFlag(p,!!s[3]);

if(p.dead)return;

const dx=s[0]-p.x;
const dz=s[1]-p.z;
const dd=wrapAngle(s[2]-p.direction);

if(respawned||Math.hypot(dx,dz)>4||Math.abs(dd)>1.2){

// Too far off: snap
p.x=s[0];
p.z=s[1];
p.direction=s[2];

}else{

const i=inputOnline();
const moving=i.up||i.down||i.left||i.right;
const g=moving?0.04:0.3;

p.x+=dx*g;
p.z+=dz*g;
p.direction+=dd*g;

}

}

function smoothRemote(p,dt){

const k=Math.min(1,dt*14);

// "Moving" is used for the ripple the enemies see while you swim
p.moving=Math.hypot(p.target.x-p.x,p.target.z-p.z)>0.08;

p.x+=(p.target.x-p.x)*k;
p.z+=(p.target.z-p.z)*k;
p.direction+=wrapAngle(p.target.d-p.direction)*k;

p.group.position.set(p.x,0,p.z);
p.group.rotation.y=-p.direction;

updateVisual(p);

}

// Guest: send our key presses to the host

function sendInput(dt){

const i=inputOnline();

const key=`${+i.up}${+i.down}${+i.left}${+i.right}${+i.shoot}${+i.dive}`;

inputTimer+=dt;

if(key!==lastInputKey||inputTimer>0.25){

lastInputKey=key;
inputTimer=0;

send({t:'i',up:i.up,down:i.down,left:i.left,right:i.right,shoot:i.shoot,dive:i.dive});

}

}

// ============================================================
// MENU / UI
// ============================================================

const menuEl=document.getElementById('menu');
const menuMain=document.getElementById('menuMain');
const menuLobby=document.getElementById('menuLobby');
const statusEl=document.getElementById('menuStatus');

function setStatus(text){
statusEl.textContent=text;
}

function showMenu(){

menuEl.style.display='flex';
menuMain.style.display='block';
menuLobby.style.display='none';

document.getElementById('result').style.display='none';

setStatus('');
updateHints();

}

function showLobby(code,text){

menuEl.style.display='flex';
menuMain.style.display='none';
menuLobby.style.display='block';

document.getElementById('roomCode').textContent=code;
document.getElementById('lobbyText').textContent=text;

// Only the host can start the match
document.getElementById('startBtn').style.display=
mode==='host'?'inline-block':'none';

setStatus('');
updateHints();

}

function updateLobbyTeams(list,team){

const line=t=>{

const l=list.filter(x=>x.t===t);

const names=l.map(x=>x.n+(x.w==='roller'?' (roller)':' (gun)')).join(', ');

return `${t===1?'BLUE':'PINK'} ${l.length}/${TEAM_MAX}: ${names||'-'}`;

};

document.getElementById('lobbyTeams').textContent=
`${line(1)}\n${line(2)}\nYOU ARE ${team===2?'PINK':'BLUE'}`;

}

function resetRoster(){

roster=defaultRoster();
myIdx=0;
currentMap=0;

}

function failToMenu(message){

mode='menu';
playing=false;

closeNet();
resetRoster();
resetMatch();

showMenu();
setStatus(message);

}

function leaveToMenu(){

mode='menu';
playing=false;

closeNet();
resetRoster();
resetMatch();

showMenu();

}

function updateHints(){

const ctl1=document.getElementById('ctl1');
const ctl2=document.getElementById('ctl2');
const info=document.getElementById('info');
const restartBtn=document.getElementById('restartBtn');

restartBtn.style.display=(mode==='host')?'inline-block':'none';

if(mode==='host'||mode==='guest'){

ctl1.textContent='MOVE: W/S or ↑/↓ · TURN: A/D or ←/→ · SHOOT / ROLL (hold): F (or ENTER / SPACE)';
ctl2.textContent='HIDE IN YOUR OWN INK: hold E, SHIFT or / (invisible to enemies, faster, can not shoot)';

const team=(me&&me.team===2)?'PINK':'BLUE';
const gear=(me&&me.kind==='roller')?'ROLLER':'SPLATTER GUN';
info.textContent=`ROOM ${net.code} · YOU ARE ${team} · ${gear} · MAP: ${MAPS[currentMap].name}`;

}else{

ctl1.textContent='Host a game or join one with a room code (4 vs 4)';
ctl2.textContent='';
info.textContent='';

}

}

// Restart / play again (host only)
function restart(){

if(mode==='host'&&playing){
startHostedMatch();
}

}

document.getElementById('roomInput').addEventListener('keydown',e=>{
if(e.key==='Enter')joinGame();
});

// ---------- USERNAME + WEAPON ----------

function cleanName(s,fallback){

return String(s==null?'':s)
.replace(/[\u0000-\u001f\u007f<>]/g,'')
.trim()
.slice(0,12)||fallback;

}

function defaultRoster(){

return[
{team:1,name:'Player',weapon:'shooter'},
{team:2,name:'Player',weapon:'shooter'}
];

}

function showWeapon(){

document.getElementById('wShooter').classList.toggle('sel',myWeapon==='shooter');
document.getElementById('wRoller').classList.toggle('sel',myWeapon==='roller');

}

function savePrefs(){

try{
localStorage.setItem('inkbattle-name',myName);
localStorage.setItem('inkbattle-weapon',myWeapon);
}catch(e){}

}

function pickWeapon(w){

myWeapon=w==='roller'?'roller':'shooter';

showWeapon();
savePrefs();

}

// Reads the name box (called when you host or join)
function readPrefs(){

myName=cleanName(document.getElementById('nameInput').value,'Player');

document.getElementById('nameInput').value=myName;

savePrefs();

}

function loadPrefs(){

try{

const n=localStorage.getItem('inkbattle-name');
const w=localStorage.getItem('inkbattle-weapon');

if(n)document.getElementById('nameInput').value=cleanName(n,'');
if(w==='roller')myWeapon='roller';

}catch(e){}

showWeapon();

}

loadPrefs();

window.pickWeapon=pickWeapon;
window.restart=restart;
window.hostGame=hostGame;
window.hostStart=hostStart;
window.joinGame=joinGame;
window.leaveToMenu=leaveToMenu;

// ============================================================
// GAME LOOP
// ============================================================

// The input that controls a player (host only)
function inputOf(p){

return p.member?p.member.input:inputOnline();

}

// Host: this machine runs the whole match
function authoritativeStep(dt){

time-=dt;

if(time<=0){
time=0;
finish();
}

timerEl.textContent=formatTime(time);

for(const p of players){
updatePlayer(p,inputOf(p),dt,true);
}

for(const p of players){
updateShots(p,true,dt);
}

calculateScore();

// Send the state to the guests
netTimer+=dt;

if(netTimer>=NET_SEND_INTERVAL){
netTimer=0;
send(snapshot());
}

}

// Online guest: predict our own movement, show what the host tells us
function guestStep(dt){

sendInput(dt);

time=Math.max(0,time-dt);
timerEl.textContent=formatTime(time);

updatePlayer(me,inputOnline(),dt,false);

for(const p of players){
if(p!==me)smoothRemote(p,dt);
}

for(const p of players){
updateShots(p,false,dt);
}

calculateScore();

}

function animate(now){

requestAnimationFrame(animate);

const dt=Math.min((now-lastTime)/1000,0.05);

lastTime=now;

if(playing&&!ended){

if(mode==='guest')guestStep(dt);
else authoritativeStep(dt);

// Keep the models in sync with the hiding state
players.forEach(updateVisual);

// MINIMAP

mapTimer+=dt;

if(mapTimer>0.1){
drawMap();
mapTimer=0;
}

}

// INK TEXTURE (upload only when something changed)

if(inkDirty){
inkTexture.needsUpdate=true;
inkDirty=false;
}

// CAMERA

updateCamera(dt);

// RENDER

renderer.render(scene,camera);

}

// ============================================================
// RESIZE
// ============================================================

function resize(){

const el=document.getElementById('game');

const w=el.clientWidth;
const h=el.clientHeight;

if(!w||!h)return;

camera.aspect=w/h;
camera.updateProjectionMatrix();

renderer.setSize(w,h);

const mapW=mapCanvas.clientWidth;
const mapH=mapCanvas.clientHeight;

if(mapW&&mapH){
mapCanvas.width=mapW;
mapCanvas.height=mapH;
}

drawMap();

}

window.addEventListener('resize',resize);

// ============================================================
// START
// ============================================================

resetPlayers();

resize();
drawMap();
updateCamera(1,true);
updateHints();

requestAnimationFrame(animate);

</script>
</body>
</html>
